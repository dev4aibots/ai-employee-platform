name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: operations report
        run: npm run report

      - name: demo (smoke)
        run: npm run demo

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  env-contract:
    name: env contract matches code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every env var read by the code must appear in .env.example
        run: |
          set -euo pipefail
          missing=0
          while read -r name; do
            if ! grep -q "^${name}=" .env.example; then
              echo "::error::$name is read by the code but missing from .env.example"
              missing=1
            fi
          done < <(grep -rhoE "env\.[A-Z][A-Z0-9_]+" src/ | sed 's/^env\.//' | sort -u)
          exit $missing

  demo:
    name: browser demo builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: generated SQL is in sync with db/
        run: node scripts/gen-sql.mjs --check
      - name: build
        working-directory: demo
        run: |
          npm install --no-audit --no-fund
          npm run build

